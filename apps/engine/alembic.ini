# Alembic configuration.
#
#     cd apps/engine
#     alembic upgrade head                      apply every migration
#     alembic downgrade -1                      undo the last one
#     alembic current                           what revision this database is at
#     alembic revision --autogenerate -m "…"    write a new one from app/db/models.py
#
# There is deliberately NO `sqlalchemy.url` here. The URL is read from `DATABASE_URL` by
# `alembic/env.py`, through the same `app.config.Settings` the service uses — so a migration cannot
# be applied to a different database than the one the engine will then talk to, and no connection
# string (with its password) is ever committed.

[alembic]
script_location = alembic
prepend_sys_path = .
# `os` rather than the legacy space/comma/colon splitting, which alembic warns about.
path_separator = os

# Revision filenames sort chronologically, which makes `ls alembic/versions` a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s_%%(rev)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
