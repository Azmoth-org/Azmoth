[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --benchmark-skip

# `--benchmark-skip` above is what keeps `tests/benchmarks/` out of an ordinary run. Those three
# tests each drive a real cold catalog load, a real solve and a real database round trip ten times
# over, and they measure wall-clock — so they belong in a run that asked for them, on a machine that
# is not also building something else. `--benchmark-only` on the command line overrides this skip
# (pytest-benchmark reconciles the two in its session setup), which makes the benchmark invocation:
#
#     python -m pytest tests/benchmarks --benchmark-only
#
# The three consequent skips in a normal run are intentional and pytest names the reason under
# `-rs`. They are counted in tests/README.md so that an unintentional skip appearing beside them
# still stands out.

# The DB layer is async, so its tests and fixtures are coroutines. `auto` rather than `strict`
# because the alternative is a `@pytest.mark.asyncio` on every one of them, and a forgotten marker
# is a test that silently passes without running.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore::UserWarning
markers =
    slow: differential and property tests that enumerate many models
