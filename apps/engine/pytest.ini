[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# The DB layer is async, so its tests and fixtures are coroutines. `auto` rather than `strict`
# because the alternative is a `@pytest.mark.asyncio` on every one of them, and a forgotten marker
# is a test that silently passes without running.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore::UserWarning
markers =
    slow: differential and property tests that enumerate many models
