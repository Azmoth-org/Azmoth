name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref cancels the previous run. Two jobs build a Docker image, so duplicated
# runs are expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================================
  # JOB 1 — the engine, tested inside its own image.
  #
  # Not on a bare runner, deliberately. Every test that drives the rules engine depends on the
  # `souffle` binary, and those tests SKIP when it is absent: a run on a runner without Soufflé
  # would go green having tested almost nothing, and would look identical to a real pass.
  # Installing Soufflé on the runner would duplicate the Dockerfile and could drift from it, so the
  # image is the only way to be sure CI tested what ships.
  #
  # REQUIRE_ENGINES=1 turns the remaining risk into a failure: with it set, a missing solver binary
  # makes the fixtures fail instead of skip (tests/conftest.py::_engines_required).
  # ===========================================================================================
  engine-tests:
    name: engine-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the engine image
        # Context is the repo root: the image needs logic/ and data/, which live outside apps/engine.
        run: docker build -f apps/engine/Dockerfile -t govatax-engine:ci .

      - name: Stack check (engines, catalog, logic, end-to-end probe)
        # Fails the job if the shipped catalog, rule tables or logic programs cannot drive a run.
        run: docker run --rm govatax-engine:ci python scripts/engine_cli.py check

      - name: pytest (inside the container, engines required)
        # No extra `-q`: pytest.ini already passes it, and a second one means `-qq`, at which pytest
        # prints no summary line at all. `-rs` lists the reason for every skip.
        run: docker run --rm -e REQUIRE_ENGINES=1 govatax-engine:ci python -m pytest -rs

  # ===========================================================================================
  # JOB 2 — the database layer, against a real Postgres.
  #
  # JOB 1 runs the whole suite, but `DATABASE_URL` there is in-memory SQLite (forced by
  # tests/conftest.py), so the four parametrisations in tests/test_db_persistence.py that exercise
  # the Postgres dialect SKIP — and a skipped durability test looks exactly like a passing one.
  # This job sets POSTGRES_TEST_URL so they run.
  #
  # What only Postgres covers: JSONB rather than a TEXT column, `SELECT … FOR UPDATE` (the SQLite
  # dialect omits it silently), `TIMESTAMP WITH TIME ZONE` returning an aware datetime, and the
  # `ON DELETE CASCADE` foreign key. It also proves `alembic upgrade head` applies to the dialect it
  # will actually be run against in production.
  #
  # No Docker build here: these tests need no solver binary, so pip-installed dependencies on the
  # bare runner are enough and the job is fast.
  # ===========================================================================================
  engine-database:
    name: engine-database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: govatax_test
        ports:
          - 5432:5432
        # Without this the job starts running tests while initdb is still going: Postgres accepts
        # TCP before it will accept a login.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the engine's pinned dependencies
        run: pip install --no-cache-dir -r apps/engine/requirements.txt

      - name: The migration applies to a real Postgres
        working-directory: apps/engine
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/govatax_test
        run: |
          python scripts/migrate.py
          # A second run must be a no-op, and --check must then agree the schema is at head.
          python scripts/migrate.py
          python scripts/migrate.py --check

      - name: Database tests against Postgres
        working-directory: apps/engine
        env:
          # The suite drops and recreates the tables around each test, so this must be a scratch
          # database — which is what the service container is.
          POSTGRES_TEST_URL: postgresql+asyncpg://postgres:test@localhost:5432/govatax_test
        run: |
          python -m pytest tests/test_db_persistence.py tests/test_audit_log.py -rs
          # A skip here means the Postgres parametrisations did not run, which is the one failure
          # this job exists to catch — and it would otherwise look like a pass.
          if python -m pytest tests/test_db_persistence.py -rs 2>&1 | grep -q "POSTGRES_TEST_URL is not set"; then
            echo "::error::POSTGRES_TEST_URL was not picked up — the Postgres dialect was not tested."
            exit 1
          fi

  # ===========================================================================================
  # JOB 3 — the JS/TS workspace.
  # ===========================================================================================
  web-checks:
    name: web-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install
        # --frozen-lockfile so a pull request cannot silently change the dependency graph.
        run: pnpm install --frozen-lockfile

      - name: turbo lint typecheck build
        run: pnpm turbo lint typecheck build

      - name: The generated TypeScript contract is not stale
        # The gate job checks the OpenAPI JSON. This checks the other half: that
        # `pnpm generate:contracts` was run after it and committed, and that schema.ts was not
        # hand-edited.
        run: |
          pnpm generate:contracts
          if ! git diff --quiet -- packages/contracts/typescript; then
            echo "::error::packages/contracts/typescript is out of date. Run: pnpm generate:contracts"
            git --no-pager diff --stat -- packages/contracts/typescript
            exit 1
          fi
          echo "generated TypeScript is in sync"

  # ===========================================================================================
  # JOB 4 — the contract and the legal posture. The one that matters most.
  #
  # No Docker here: `export_openapi.py --check` only builds the FastAPI app object and serialises
  # its schema. It never solves, so it needs clingo (a wheel) but not the Soufflé binary — which
  # makes this job fast enough to be the first thing a contributor sees fail.
  # ===========================================================================================
  contract-and-logic-gate:
    name: contract-and-logic-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The logic guard diffs against the base branch, which needs full history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the engine's pinned dependencies
        run: pip install --no-cache-dir -r apps/engine/requirements.txt

      # ---------------------------------------------------------------------------------------
      # STEP 1 — the committed OpenAPI document must match the FastAPI code.
      # ---------------------------------------------------------------------------------------
      - name: OpenAPI contract is in sync with the code
        working-directory: apps/engine
        run: |
          if ! python scripts/export_openapi.py --check; then
            echo "::error::The committed OpenAPI document does not match the FastAPI app. Run, in this order: (cd apps/engine && python scripts/export_openapi.py) && pnpm generate:contracts"
            exit 1
          fi

      # ---------------------------------------------------------------------------------------
      # STEP 2 — the logic guard.
      #
      # Changing the solver logic or the catalog changes what this product is willing to bill for.
      # The golden snapshots are the only evidence that the billing behaviour is still correct, so a
      # change to one without a look at the other is refused.
      #
      # This does not judge WHETHER the new behaviour is right — a human does that. It refuses the
      # case where nobody looked.
      # ---------------------------------------------------------------------------------------
      - name: Logic guard — legal artefacts require a golden-snapshot review
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")

          echo "Files changed in this pull request:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          echo

          # The legal artefacts: the solver programs, and the versioned official data they run on.
          #
          # Narrowed to data/catalogs/goae_current/ rather than all of data/catalogs/. That
          # directory holds the real official GOÄ snapshot and is the only catalog edition the
          # engine bills with (DEFAULT_CATALOG_VERSION); the era directories beside it are small
          # synthetic fixtures for the temporal-routing tests, carry "synthetic": true, and cannot
          # move a golden receipt because no golden case loads them. Gating on them would demand
          # golden-snapshot evidence for a change that provably has no billing behaviour to
          # re-examine — and a gate that fires when nothing happened is a gate people learn to
          # bypass. Adding a *real* edition still trips this, because its directory is not a
          # fixture and someone must look at what it prices. See data/catalogs/README.md.
          legal=$(printf '%s\n' "$changed" \
            | grep -E '^(logic/asp/|logic/datalog/|data/catalogs/goae_current/|data/rules/)' || true)

          # The evidence that billing behaviour was re-examined.
          evidence=$(printf '%s\n' "$changed" \
            | grep -E '^logic/tests/(golden|cases)/' || true)

          if [ -z "$legal" ]; then
            echo "No changes under logic/asp/, logic/datalog/, data/catalogs/goae_current/ or data/rules/."
            echo "Logic guard: not applicable."
            exit 0
          fi

          echo "Legal artefacts changed:"
          printf '%s\n' "$legal" | sed 's/^/  /'
          echo

          if [ -n "$evidence" ]; then
            echo "Golden snapshots / cases also changed:"
            printf '%s\n' "$evidence" | sed 's/^/  /'
            echo
            echo "::warning title=Legal artefacts changed::This pull request modifies the legal reasoning or the catalog. The golden snapshots were touched, so the billing behaviour was re-examined — the reviewer must confirm that every changed number is correct and intended. See logic/README.md."
            echo "Logic guard: satisfied."
            exit 0
          fi

          echo "🚨 LOGIC OR DATA CHANGED WITHOUT GOLDEN SNAPSHOT UPDATE. You modified the legal reasoning or catalog. You must review and update the golden snapshots in logic/tests/ to prove the billing behavior is still correct."
          echo "::error title=Logic guard failed::🚨 LOGIC OR DATA CHANGED WITHOUT GOLDEN SNAPSHOT UPDATE. You modified the legal reasoning or catalog. You must review and update the golden snapshots in logic/tests/ to prove the billing behavior is still correct."
          exit 1

      # ---------------------------------------------------------------------------------------
      # STEP 3 — nothing that looks like a credential, and no real .env, may be committed.
      # ---------------------------------------------------------------------------------------
      - name: No committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked. Only .env.example belongs in the repository."
            exit 1
          fi
          if git grep -lIE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- . ; then
            echo "::error::Something that looks like a credential is committed."
            exit 1
          fi
          echo "no tracked .env, no credential-shaped strings"
