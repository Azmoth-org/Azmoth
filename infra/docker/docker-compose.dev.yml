# DEVELOPMENT stack — standalone file, run it by itself:
#
#     docker compose -f infra/docker/docker-compose.dev.yml up --build
#
#     http://localhost:3000   the review and audit UI (Turbopack dev server, hot-reloading)
#     http://localhost:3001   the public marketing site (Turbopack dev server, hot-reloading)
#     http://localhost:8000   the engine's API (and /docs), uvicorn --reload
#     http://localhost:8080   Adminer, a web UI for the database
#
# This is a full copy of the stack in docker-compose.yml, not an override layered on top of it —
# deliberately, after an IDE "compose up" task pointed at this file alone failed with "service ...
# has neither an image nor a build context specified": any tool or shortcut that runs a single
# compose file (which is the common case — a right-click "Compose Up" in an editor, a task runner
# entry, someone typing the obvious `-f` for the file they have open) needs this file to be complete
# on its own. `docker-compose.yml` is the PRODUCTION stack: same idea, no bind mounts, no --reload,
# the standalone web build. Use whichever one matches what you're doing; do not pass both `-f` flags
# together — that used to be required here and no longer is.
#
# `engine`'s image tag is deliberately the SAME in both files (azmoth-engine:0.3.0): it is built from
# the identical Dockerfile and context either way — see apps/engine/Dockerfile's header for why that
# Dockerfile is not itself split in two — so this file's `engine` build and the prod file's produce
# the same image, and sharing the tag avoids storing it twice. `web` differs: this file builds
# apps/web/Dockerfile.dev (the `next dev` image), which is a genuinely different image from
# apps/web/Dockerfile (the traced standalone bundle), so it gets its own tag, azmoth-web:dev.
#
# Both stacks use the SAME named Postgres volume (azmoth-postgres-data, declared in both files with
# an explicit `name:`) and the same default project name (both compose files live in this directory),
# so switching between `docker-compose.yml` and this file reuses one local database and one set of
# containers — matching the point of `docker compose down` keeping data across runs. Do not run both
# stacks at once: their engine/web/postgres container names collide.

services:
  postgres:
    image: postgres:15-alpine
    # No `container_name`, for the same reason the engine has none: a fixed name collides with
    # `docker compose run`.
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-azmoth}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-azmoth}"
      POSTGRES_DB: "${POSTGRES_DB:-azmoth}"
      # Deterministic collation and encoding for a fresh cluster. Not cosmetic: `ORDER BY` on a
      # Ziffer or a name is locale-dependent, and a database initialised under a different locale
      # sorts differently — which would make a listing's order depend on the machine it was created
      # on rather than on the data.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Published on 5432 so `psql` and `alembic` on the host can reach it. Override with
      # POSTGRES_PORT if 5432 is already taken locally.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A named volume, NOT a bind mount into the repo: this holds approval records, and a
      # `git clean` must not be able to delete them. `docker compose down -v` is the deliberate way.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` against the real user and database, not the defaults: the postgres image
      # accepts TCP connections during initdb, before it will accept a login, and a healthcheck
      # that only proved the port was open would let the engine start and fail its first query.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-azmoth} -d ${POSTGRES_DB:-azmoth}",
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  engine:
    build:
      context: ../..
      dockerfile: apps/engine/Dockerfile
    image: azmoth-engine:0.3.0
    # Deliberately no `container_name`: a fixed name makes `docker compose run` collide with the
    # already-running service and shut it down, which breaks running the tests in a second shell
    # while the API is up.
    depends_on:
      postgres:
        # `service_healthy`, not `service_started`. The engine's first act is to migrate, and a
        # migration against a cluster still running initdb fails. The entrypoint also retries for
        # MIGRATION_WAIT_SECONDS, so the two together survive a slow first boot as well as a
        # healthcheck that is momentarily wrong.
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DEBUG: "${DEBUG:-false}"
      EXTRACTION_MODE: "manual"
      UNVERIFIED_RULE_POLICY: "${UNVERIFIED_RULE_POLICY:-warn}"
      BASE_FACTOR_POLICY: "${BASE_FACTOR_POLICY:-schwellenwert}"
      SOLVER_TIMEOUT_SECONDS: "${SOLVER_TIMEOUT_SECONDS:-5}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      SOUFFLE_BIN: souffle
      LOGIC_DIR: /srv/logic
      DATA_DIR: /srv/data

      # -- database --------------------------------------------------------------------------
      # `postgres` is the compose service name, resolved on the default network. The async driver
      # is part of the URL: SQLAlchemy picks asyncpg from the `+asyncpg` suffix.
      #
      # The credentials here are the compose defaults and are development credentials. A real
      # deployment supplies DATABASE_URL from its secret store; nothing in this repository should
      # ever hold a production one, and CI fails the build if a credential-shaped string appears.
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-azmoth}:${POSTGRES_PASSWORD:-azmoth}@postgres:5432/${POSTGRES_DB:-azmoth}}"
      # The schema comes from `alembic upgrade head`, run by the entrypoint. Never create_all.
      DATABASE_AUTO_CREATE: "false"
      DATABASE_ECHO: "${DATABASE_ECHO:-false}"
      # How long the entrypoint waits for Postgres to accept a login before giving up. Belt and
      # braces alongside `depends_on: service_healthy`, which does not help when the database is
      # behind a proxy that is up before the database is.
      MIGRATION_WAIT_SECONDS: "${MIGRATION_WAIT_SECONDS:-60}"

      # Refusing production data is the default and should stay that way. See
      # docs/compliance/PRIVATE_DATA_WARNING.md before changing it.
      PADNEXT_ALLOW_REAL_DATA: "false"

      # strict | warn | off — how hard the PADnext framing check bites. Strict here too, and
      # deliberately not looser than the production stack: a developer who cannot reproduce a
      # pilot 422 locally is a developer who will not fix it. Set PADNEXT_SCHEMA_POLICY=warn in
      # infra/docker/.env to work against a real, imperfect export.
      PADNEXT_SCHEMA_POLICY: "${PADNEXT_SCHEMA_POLICY:-strict}"

      # -- the partner API -------------------------------------------------------------------
      # The one writable path in this service, and the reason it is not under /srv: every mount
      # below is `:ro` on purpose, and /srv is root-owned while the engine runs as uid 10001.
      UPLOAD_DIR: /var/lib/azmoth/uploads
      RATE_LIMIT_SINGLE_PER_MINUTE: "${RATE_LIMIT_SINGLE_PER_MINUTE:-100}"
      RATE_LIMIT_BULK_PER_HOUR: "${RATE_LIMIT_BULK_PER_HOUR:-10}"
      # Off by default in development, unlike the production file. A limiter that refuses the
      # eleventh bulk upload of the hour is correct in front of a customer and is only in the way
      # while somebody is iterating on an integration against their own machine.
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
    volumes:
      # The bulk uploads. A named volume rather than a bind mount into the repo, and the same
      # volume the production file uses, for the same reason `postgres-data` is shared: dev and
      # prod are one local stack, and a `git clean` must not be able to delete an accepted job.
      - engine-uploads:/var/lib/azmoth/uploads
      # Live-edit the rules while developing: change goae_rules.dl, goae_optimize.lp or any CSV in
      # data/rules/ and the next request picks it up, no rebuild. Read-only, so a container cannot
      # modify the committed catalog.
      - ../../logic:/srv/logic:ro
      - ../../data:/srv/data:ro
      - ../../apps/engine/app:/srv/app:ro
      - ../../apps/engine/tests:/srv/tests:ro
      - ../../apps/engine/scripts:/srv/scripts:ro
      # Mounted so the entrypoint's staleness check compares the pins the WORKING TREE declares
      # against the packages the IMAGE actually has. Without this mount it would read the image's
      # own baked copy and compare it against the packages installed from it — always a match, and
      # blind to exactly the drift it exists to catch. Read-only; nothing installs at runtime.
      - ../../apps/engine/requirements.txt:/srv/requirements.txt:ro
      # Mounted too, so a migration added while the stack is up is picked up by a restart rather
      # than needing a rebuild. Read-only: a container must not be able to rewrite its own history.
      - ../../apps/engine/alembic:/srv/alembic:ro
      - ../../apps/engine/alembic.ini:/srv/alembic.ini:ro
    # Only the server command. The entrypoint runs the migration first whatever this says — which is
    # why it is an ENTRYPOINT and not part of the CMD (see apps/engine/scripts/docker-entrypoint.sh).
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:8000/api/v1/health')); sys.exit(0 if d['souffle_available'] and d['status']=='ok' else 1)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # A one-shot: create Better Auth's tables — `user`, `session`, `account`, `verification`, and
  # `organization`, `member`, `invitation` from the organization plugin — then exit. `web` waits for
  # it to succeed.
  #
  # It exists because this database has two migrators with disjoint table sets. The engine's
  # entrypoint runs `alembic upgrade head` for the proposals and the audit log; Better Auth's
  # schema is the library's own to define, so it is created by `apps/web/scripts/auth-migrate.ts`
  # from the very instance `apps/web/lib/auth.ts` configures. `apps/engine/alembic/env.py`
  # excludes all of them from autogenerate, so the two migrators can never fight over them.
  #
  # It runs the dev image, which carries the whole workspace — pnpm, the script and tsx — so
  # there is nothing extra to build.
  #
  # Idempotent. On every `up` after the first it finds the tables present and says it has nothing
  # to do, which is why it belongs in the startup path rather than in a README step people miss.
  web-auth-migrate:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
    image: azmoth-web:dev
    command: ["pnpm", "--filter", "web", "auth:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The same database the engine writes proposals to, and the same credentials — the whole
      # point is that `audit_events.actor` and `proposals.created_by` hold a `user.id` a join can
      # resolve. The `+asyncpg` suffix is SQLAlchemy's and means nothing to `pg`;
      # `apps/web/lib/auth-db.ts` strips it, so one value is shared verbatim between the tiers.
      AUTH_DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-azmoth}:${POSTGRES_PASSWORD:-azmoth}@postgres:5432/${POSTGRES_DB:-azmoth}}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
    # A migration that fails must fail the stack, not be retried forever by a restart policy.
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
    image: azmoth-web:dev
    # No `container_name`, for the same reason the other two have none.
    depends_on:
      engine:
        # `service_healthy`, not `service_started`. The engine's healthcheck proves Soufflé is
        # present and the catalog loaded, so waiting on it means the first screen a reviewer opens
        # either works or reports a real problem — rather than showing "Engine nicht erreichbar"
        # for the twenty seconds the engine spends migrating and loading the catalog.
        condition: service_healthy
      web-auth-migrate:
        # Every screen is behind a login now, so a web container that came up before its `session`
        # table existed would serve nothing but a 500 on the sign-in form.
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Server-side ONLY, and deliberately not NEXT_PUBLIC_: the browser must never learn the
      # engine's address. Every call goes through a Next route handler under /api/engine/*, and that
      # is the seam authentication sits in — those routes refuse a request without a Better Auth
      # session and forward the signed-in user's id to the engine, which records it in the audit log.
      #
      # `engine` is the compose service name, resolved on the default network. Overridable so the
      # same image can be pointed at an engine outside this stack.
      ENGINE_BASE_URL: "${ENGINE_BASE_URL:-http://engine:8000}"

      # -- authentication ---------------------------------------------------------------------
      # Better Auth runs inside this Next.js app, at /api/auth/*. Its tables live in the same
      # Postgres as the proposals, so an audit row's actor resolves to a person by a join rather
      # than by correlating two systems — see apps/web/lib/auth-db.ts.
      AUTH_DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-azmoth}:${POSTGRES_PASSWORD:-azmoth}@postgres:5432/${POSTGRES_DB:-azmoth}}"
      #
      # REQUIRED, and deliberately without a default. It signs every session cookie, so a value that
      # changes between boots signs sessions the next container cannot verify — which presents as
      # "everyone is randomly logged out" and is diagnosed as anything but a missing variable. The
      # app refuses to start without it under NODE_ENV=production rather than generating one.
      #
      #     openssl rand -base64 32
      #
      # It belongs in the deployment's secret store. Nothing in this repository should ever hold a
      # real one, and CI fails the build if a credential-shaped string is committed.
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      #
      # Only needed when a proxy terminates TLS on a different hostname than the container sees.
      # Same-origin use — which is all this application does — needs nothing here.
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-}"
      #
      # Who may create an account — see apps/web/lib/auth-allowlist.ts and the longer note in
      # docker-compose.yml. Passed BARE here, and that is the one line where this file deliberately
      # differs from the production one: bare means "hand it over if the host has one, and define
      # nothing otherwise", and an UNDEFINED allowlist is the permissive case under a development
      # NODE_ENV. `docker compose -f docker-compose.dev.yml up` must not require a variable before
      # the first account can be created. Production defines it as "" and is shut by default.
      SIGNUP_ALLOWLIST:
      #
      # OPTIONAL, and off unless BOTH are set: with neither, the Google provider is not registered
      # and no button is rendered — email and password remain the way in. Setting one alone logs a
      # warning and counts as unset, so a typo here cannot take down sign-in generally.
      #
      # Google must be told the exact callback, character for character, under "Authorised redirect
      # URIs" — for this stack that is http://localhost:${WEB_PORT:-3000}/api/auth/callback/google.
      # Change WEB_PORT and the registered URI has to change with it. The secret belongs in the
      # deployment's secret store, never in a committed file; see apps/web/.env.example.
      # Passed through bare, NOT as "${GOOGLE_CLIENT_ID:-}". The `:-` form sets the variable to an
      # empty string when the host has none, and a variable that is *defined* — even as "" — is one
      # Next.js will not overwrite from `apps/web/.env`. That is how a correctly configured .env
      # produced a login screen with no Google button: the file was mounted and read, and this line
      # had already shadowed it. Bare means "pass it on if the host has one", and nothing otherwise.
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
    volumes:
      # Live-edit the app while developing, same idea as the engine's mounts above: change a file
      # under any of these and Next's dev server picks it up, no rebuild. `@workspace/ui` and
      # `@workspace/contracts` are consumed as source (see their `exports` maps), so both need to be
      # mounted too, not just apps/web — editing a shared component would otherwise still need one.
      # `@workspace/typescript-config` is not consumed by the app itself, but apps/web/tsconfig.json
      # `extends` its nextjs.json, which only lands in the image via a full source COPY (see
      # apps/web/Dockerfile.dev) — without this mount an edit to the config package itself would need
      # a rebuild to show up, same as any other unmounted package.
      - ../../apps/web:/repo/apps/web
      - ../../packages/ui:/repo/packages/ui
      - ../../packages/contracts:/repo/packages/contracts
      - ../../packages/typescript-config:/repo/packages/typescript-config
      # Anonymous volumes, listed with no host path, so each masks the bind mount above just for
      # that one subdirectory. Without these, the bind mounts would shadow the node_modules and
      # .next that `pnpm install`/first boot produced *inside* the image with whatever (or nothing)
      # exists on the host, which is a broken or missing install rather than a live-reload win.
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
      - /repo/packages/ui/node_modules
      - /repo/packages/contracts/node_modules
    healthcheck:
      # Asks the Next.js server whether it can serve a request. Deliberately NOT a page and not a
      # proxy to the engine: `/` renders live engine data, so a healthcheck pointed at it would mark
      # this container unhealthy — and have it restarted — whenever the engine restarted.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # The public marketing site — http://localhost:${MARKETING_PORT:-3001}
  #
  # It is in this stack for one reason: the "Anmelden" and "Kostenlos testen" buttons point at
  # `web`, and the only way to check that they land somewhere real is to have both running. It
  # shares nothing else. No database, no session, no engine — the whole point of the marketing app
  # is that it holds no data, so it has no `depends_on: postgres` and it does not care whether the
  # rest of the stack is healthy.
  #
  # 3001 on the host, 3000 in the container. `web` already owns 3000 on the host; inside its own
  # network namespace this container has the port to itself, so the two images stay symmetrical and
  # only the published side differs.
  #
  # APP_URL is the address of `web` **as a browser on the host sees it** — http://localhost:3000,
  # not http://web:3000. These links are followed by the visitor's browser, which is outside this
  # network and cannot resolve a compose service name. That is the opposite of ENGINE_BASE_URL
  # above, which is fetched by the `web` container itself and therefore does use the service name.
  #
  # Under `next dev` this is read on every compile, so changing it here and restarting is enough.
  # A production image bakes it at build time instead — every page is statically prerendered — so
  # there it is a build argument. See apps/marketing/src/lib/site.ts.
  marketing:
    build:
      context: ../..
      dockerfile: apps/marketing/Dockerfile.dev
    image: azmoth-marketing:dev
    # No `container_name`, for the same reason nothing else here has one.
    ports:
      - "${MARKETING_PORT:-3001}:3000"
    environment:
      APP_URL: "${APP_URL:-http://localhost:${WEB_PORT:-3000}}"
      # The same value under the name the app also accepts, so either spelling works for anyone
      # who reaches for the one they have seen in a Next.js project before.
      NEXT_PUBLIC_APP_URL: "${APP_URL:-http://localhost:${WEB_PORT:-3000}}"
      # Canonical URLs, the sitemap and og:url are built from this. Without it they would point at
      # the localhost default baked into lib/seo.ts.
      NEXT_PUBLIC_SITE_URL: "${MARKETING_SITE_URL:-http://localhost:${MARKETING_PORT:-3001}}"
      # Unset means the cookie banner never appears and no analytics script is ever loaded, which
      # is the right default for a development stack.
      NEXT_PUBLIC_GA_MEASUREMENT_ID: "${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}"
    volumes:
      # Live-edit, same idea as `web` above. `@workspace/ui` is consumed as source, so editing a
      # shared component has to reload here too — and `@workspace/typescript-config` is mounted for
      # the same reason it is there: apps/marketing/tsconfig.json `extends` its nextjs.json.
      - ../../apps/marketing:/repo/apps/marketing
      - ../../packages/ui:/repo/packages/ui
      - ../../packages/typescript-config:/repo/packages/typescript-config
      # Anonymous volumes masking the bind mounts for these subdirectories only, so the host's
      # (missing, or host-arch) node_modules and .next do not shadow what the image installed.
      - /repo/node_modules
      - /repo/apps/marketing/node_modules
      - /repo/apps/marketing/.next
      - /repo/packages/ui/node_modules
    healthcheck:
      # The homepage itself. Unlike `web`, this app has no /api/health to ask and needs none: it
      # renders no live data, so a page that returns 200 genuinely means the site is up.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # A web UI for the database on http://localhost:${ADMINER_PORT:-8080} — log in with the
  # POSTGRES_USER / POSTGRES_PASSWORD above, server `postgres`, database `azmoth`.
  #
  # It is here to answer the questions this stack makes people ask: which rows does
  # `proposals.organization_id` actually carry, did `alembic upgrade head` land, does the Better Auth
  # `organization` table hold the id the rail is showing. Doing that with `docker compose exec
  # postgres psql` works and is a worse loop when the answer is a wide row you want to read as a
  # table.
  #
  # `ADMINER_DEFAULT_SERVER` pre-fills the server field with the compose service name, which is the
  # one thing about this login form that is not guessable from inside the container network.
  #
  # **Development only, and it is in the dev file for that reason.** This is an unauthenticated
  # front door to a database holding approvals and an append-only audit log: anything that can reach
  # port 8080 can read and write every table, migrations included. `docker-compose.yml` — the
  # production stack — carries it behind a `debug` profile so it does not start unless asked.
  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    # Named so it survives `docker compose down` and is removed only by `down -v`. It holds
    # approvals; deleting it is a decision, not a side effect of stopping the stack. Same explicit
    # name as docker-compose.yml's volume, deliberately: dev and prod share one local database.
    name: azmoth-postgres-data
  engine-uploads:
    # And the same for the bulk uploads, for the same reason and with the same name as in
    # docker-compose.yml: a job accepted with a `202` under one file must still be there under the
    # other.
    name: azmoth-engine-uploads
