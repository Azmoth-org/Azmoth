# PRODUCTION stack — standalone file, run it by itself:
#
#     docker compose -f infra/docker/docker-compose.yml up --build
#
#     http://localhost:3000   the review and audit UI
#     http://localhost:3001   the public marketing site
#     http://localhost:8000   the engine's API (and /docs)
#
# Builds and runs the images that actually ship: the standalone Next.js bundle, no bind mounts, no
# --reload. For local development use docker-compose.dev.yml instead — a separate, equally standalone
# file (do not pass both `-f` flags together; see that file's header for why it is a full copy of
# this one rather than an override layered on top).
#
# The build context of both images is the repo root, because each needs files from outside its own
# app directory: the engine needs `logic/` and `data/`, the web app needs the pnpm lockfile and the
# `packages/*` it consumes as source.
#
# Four services. Three of them start in order by their healthchecks: `postgres` holds the proposals and
# the immutable audit log; `engine` migrates it on start (`alembic upgrade head`, in the image's
# entrypoint) and then serves the API; `web` serves the UI and is the only tier a browser talks to.
# There is no in-memory fallback: the engine refuses to start under APP_ENV=production without a
# Postgres DATABASE_URL, which is the point of this stack existing rather than a bare `uvicorn`.
#
# The fourth, `marketing`, is in no order at all — it holds no data and talks to nothing, so it
# comes up on its own and stays up whatever the rest of the stack is doing.

services:
  postgres:
    image: postgres:15-alpine
    # No `container_name`, for the same reason the engine has none: a fixed name collides with
    # `docker compose run`.
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-azmoth}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-azmoth}"
      POSTGRES_DB: "${POSTGRES_DB:-azmoth}"
      # Deterministic collation and encoding for a fresh cluster. Not cosmetic: `ORDER BY` on a
      # Ziffer or a name is locale-dependent, and a database initialised under a different locale
      # sorts differently — which would make a listing's order depend on the machine it was created
      # on rather than on the data.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Published on 5432 so `psql` and `alembic` on the host can reach it. Override with
      # POSTGRES_PORT if 5432 is already taken locally.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A named volume, NOT a bind mount into the repo: this holds approval records, and a
      # `git clean` must not be able to delete them. `docker compose down -v` is the deliberate way.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` against the real user and database, not the defaults: the postgres image
      # accepts TCP connections during initdb, before it will accept a login, and a healthcheck
      # that only proved the port was open would let the engine start and fail its first query.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-azmoth} -d ${POSTGRES_DB:-azmoth}",
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  engine:
    build:
      context: ../..
      dockerfile: apps/engine/Dockerfile
    image: azmoth-engine:0.3.0
    # Deliberately no `container_name`: a fixed name makes `docker compose run` collide with the
    # already-running service and shut it down, which breaks running the tests in a second shell
    # while the API is up.
    depends_on:
      postgres:
        # `service_healthy`, not `service_started`. The engine's first act is to migrate, and a
        # migration against a cluster still running initdb fails. The entrypoint also retries for
        # MIGRATION_WAIT_SECONDS, so the two together survive a slow first boot as well as a
        # healthcheck that is momentarily wrong.
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      DEBUG: "${DEBUG:-false}"
      EXTRACTION_MODE: "manual"
      UNVERIFIED_RULE_POLICY: "${UNVERIFIED_RULE_POLICY:-warn}"
      BASE_FACTOR_POLICY: "${BASE_FACTOR_POLICY:-schwellenwert}"
      SOLVER_TIMEOUT_SECONDS: "${SOLVER_TIMEOUT_SECONDS:-5}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      SOUFFLE_BIN: souffle
      LOGIC_DIR: /srv/logic
      DATA_DIR: /srv/data

      # -- database --------------------------------------------------------------------------
      # `postgres` is the compose service name, resolved on the default network. The async driver
      # is part of the URL: SQLAlchemy picks asyncpg from the `+asyncpg` suffix.
      #
      # The credentials here are the compose defaults and are development credentials. A real
      # deployment supplies DATABASE_URL from its secret store; nothing in this repository should
      # ever hold a production one, and CI fails the build if a credential-shaped string appears.
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-azmoth}:${POSTGRES_PASSWORD:-azmoth}@postgres:5432/${POSTGRES_DB:-azmoth}}"
      # The schema comes from `alembic upgrade head`, run by the entrypoint. Never create_all.
      DATABASE_AUTO_CREATE: "false"
      DATABASE_ECHO: "${DATABASE_ECHO:-false}"
      # How long the entrypoint waits for Postgres to accept a login before giving up. Belt and
      # braces alongside `depends_on: service_healthy`, which does not help when the database is
      # behind a proxy that is up before the database is.
      MIGRATION_WAIT_SECONDS: "${MIGRATION_WAIT_SECONDS:-60}"

      # Refusing production data is the default and should stay that way. See
      # docs/compliance/PRIVATE_DATA_WARNING.md before changing it.
      PADNEXT_ALLOW_REAL_DATA: "false"

      # How hard the PADnext framing check bites: strict | warn | off.
      #
      # `strict` is the default here and not merely inherited from the application default, because
      # this file is the production stack and the substitution is where an operator can see what
      # they are changing. A delivery whose framing is wrong is refused with 422 and every
      # violation named.
      #
      # `warn` is the pilot setting — see infra/docker/.env.example. It audits a 99 %-conforming
      # real PVS export anyway and puts every violation on the report as `schema_warnings`, plus
      # one structured log line per delivery carrying the request id. It does NOT relax anything
      # about how positions are judged; only whether bad framing is fatal.
      PADNEXT_SCHEMA_POLICY: "${PADNEXT_SCHEMA_POLICY:-strict}"

      # -- the partner API -------------------------------------------------------------------
      # Where POST /api/v1/audit/bulk writes an uploaded archive. Matches the volume below, and
      # matches what the Dockerfile creates for uid 10001 — /srv is root-owned on purpose, so this
      # cannot live under the app tree.
      UPLOAD_DIR: /var/lib/azmoth/uploads
      RATE_LIMIT_SINGLE_PER_MINUTE: "${RATE_LIMIT_SINGLE_PER_MINUTE:-100}"
      RATE_LIMIT_BULK_PER_HOUR: "${RATE_LIMIT_BULK_PER_HOUR:-10}"
      # In-process counters. Leave this on for the single-container shape this file describes; turn
      # it off if a gateway in front is already doing the job, because two limiters that disagree
      # are worse than one. See apps/engine/app/api/ratelimit.py.
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
    volumes:
      # A named volume, NOT a bind mount into the repo, and for the same reason `postgres-data` is
      # one: this holds uploaded billing deliveries, and a `git clean` must not be able to delete a
      # job that has been accepted but not yet audited. It is what makes the on-disk archive
      # actually survive a `docker compose up --build` — inside the container's writable layer it
      # would not, and a restart would strand exactly the jobs the design exists to resume.
      #
      # This is the only writable path in the service. The rest of the image — app, logic, data,
      # migrations — stays root-owned and read-only to the runtime user; see the Dockerfile.
      - engine-uploads:/var/lib/azmoth/uploads
    # No `command:` override here — this service runs exactly the image apps/engine/Dockerfile
    # bakes: app/logic/data/migrations as COPYd at build time, uvicorn with no --reload. The dev
    # overlay adds a bind mount and --reload; see infra/docker/docker-compose.dev.yml.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:8000/api/v1/health')); sys.exit(0 if d['souffle_available'] and d['status']=='ok' else 1)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # A one-shot: create Better Auth's tables — `user`, `session`, `account`, `verification`, and
  # `organization`, `member`, `invitation` from the organization plugin — then exit. `web` waits for
  # it to succeed.
  #
  # It exists because this database has two migrators with disjoint table sets. The engine's
  # entrypoint runs `alembic upgrade head` for the proposals and the audit log; Better Auth's
  # schema is the library's own to define, so it is created by `apps/web/scripts/auth-migrate.ts`
  # from the very instance `apps/web/lib/auth.ts` configures. `apps/engine/alembic/env.py`
  # excludes all of them from autogenerate, so the two migrators can never fight over them.
  #
  # `target: builder` because the shipped `web` image carries only the traced server bundle:
  # no pnpm, no scripts, no TypeScript. The builder stage has all three and is already built
  # and cached by the `web` service's own build, so this costs a container start rather than a
  # second compile.
  #
  # Idempotent. On every `up` after the first it finds the tables present and says it has nothing
  # to do, which is why it belongs in the startup path rather than in a README step people miss.
  web-auth-migrate:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: builder
    command: ["pnpm", "--filter", "web", "auth:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The same database the engine writes proposals to, and the same credentials — the whole
      # point is that `audit_events.actor` and `proposals.created_by` hold a `user.id` a join can
      # resolve. The `+asyncpg` suffix is SQLAlchemy's and means nothing to `pg`;
      # `apps/web/lib/auth-db.ts` strips it, so one value is shared verbatim between the tiers.
      AUTH_DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-azmoth}:${POSTGRES_PASSWORD:-azmoth}@postgres:5432/${POSTGRES_DB:-azmoth}}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
    # A migration that fails must fail the stack, not be retried forever by a restart policy.
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: azmoth-web:0.3.0
    # No `container_name`, for the same reason the other two have none.
    depends_on:
      engine:
        # `service_healthy`, not `service_started`. The engine's healthcheck proves Soufflé is
        # present and the catalog loaded, so waiting on it means the first screen a reviewer opens
        # either works or reports a real problem — rather than showing "Engine nicht erreichbar"
        # for the twenty seconds the engine spends migrating and loading the catalog.
        condition: service_healthy
      web-auth-migrate:
        # Every screen is behind a login now, so a web container that came up before its `session`
        # table existed would serve nothing but a 500 on the sign-in form.
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Server-side ONLY, and deliberately not NEXT_PUBLIC_: the browser must never learn the
      # engine's address. Every call goes through a Next route handler under /api/engine/*, and that
      # is the seam authentication sits in — those routes refuse a request without a Better Auth
      # session and forward the signed-in user's id to the engine, which records it in the audit log.
      #
      # `engine` is the compose service name, resolved on the default network. Overridable so the
      # same image can be pointed at an engine outside this stack.
      ENGINE_BASE_URL: "${ENGINE_BASE_URL:-http://engine:8000}"

      # -- authentication ---------------------------------------------------------------------
      # Better Auth runs inside this Next.js app, at /api/auth/*. Its tables live in the same
      # Postgres as the proposals, so an audit row's actor resolves to a person by a join rather
      # than by correlating two systems — see apps/web/lib/auth-db.ts.
      AUTH_DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-azmoth}:${POSTGRES_PASSWORD:-azmoth}@postgres:5432/${POSTGRES_DB:-azmoth}}"
      #
      # REQUIRED, and deliberately without a default. It signs every session cookie, so a value that
      # changes between boots signs sessions the next container cannot verify — which presents as
      # "everyone is randomly logged out" and is diagnosed as anything but a missing variable. The
      # app refuses to start without it under NODE_ENV=production rather than generating one.
      #
      #     openssl rand -base64 32
      #
      # It belongs in the deployment's secret store. Nothing in this repository should ever hold a
      # real one, and CI fails the build if a credential-shaped string is committed.
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      #
      # Only needed when a proxy terminates TLS on a different hostname than the container sees.
      # Same-origin use — which is all this application does — needs nothing here.
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-}"
      #
      # REQUIRED IN PRODUCTION, and the door to the whole deployment. A comma- or
      # whitespace-separated list of the addresses that may create an account:
      #
      #     SIGNUP_ALLOWLIST="anna@praxis-beispiel.de, @abrechnung-nord.de"
      #
      # An entry starting with `@` is a domain and admits everyone at it; anything else is one
      # exact address. Matching is case-insensitive. See apps/web/lib/auth-allowlist.ts.
      #
      # Passed as "${SIGNUP_ALLOWLIST:-}" — the `:-` form, deliberately, and the opposite choice
      # from GOOGLE_CLIENT_ID below. That form DEFINES the variable as "" when the host has none,
      # and "" parses to an empty rule list, which admits nobody. A variable that is merely absent
      # would be permissive under a non-production NODE_ENV. Defining it means this stack is shut
      # by default whatever NODE_ENV says, and an operator who wants a pilot user has to name them.
      # Nothing here can be shadowed by an apps/web/.env: the production image ships the standalone
      # bundle and carries no such file.
      SIGNUP_ALLOWLIST: "${SIGNUP_ALLOWLIST:-}"
      #
      # OPTIONAL, and off unless BOTH are set: with neither, the Google provider is not registered
      # and no button is rendered — email and password remain the way in. Setting one alone logs a
      # warning and counts as unset, so a typo here cannot take down sign-in generally.
      #
      # Google must be told the exact callback, character for character, under "Authorised redirect
      # URIs" — for this stack that is http://localhost:${WEB_PORT:-3000}/api/auth/callback/google.
      # Change WEB_PORT and the registered URI has to change with it. The secret belongs in the
      # deployment's secret store, never in a committed file; see apps/web/.env.example.
      # Passed through bare, NOT as "${GOOGLE_CLIENT_ID:-}". The `:-` form sets the variable to an
      # empty string when the host has none, and a variable that is *defined* — even as "" — is one
      # Next.js will not overwrite from `apps/web/.env`. That is how a correctly configured .env
      # produced a login screen with no Google button: the file was mounted and read, and this line
      # had already shadowed it. Bare means "pass it on if the host has one", and nothing otherwise.
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
    # No `volumes:` here — this service runs the standalone bundle apps/web/Dockerfile traces at
    # build time, nothing else. The dev overlay swaps the Dockerfile and adds the bind mounts; see
    # infra/docker/docker-compose.dev.yml.
    healthcheck:
      # Asks the Next.js server whether it can serve a request. Deliberately NOT a page and not a
      # proxy to the engine: `/` renders live engine data, so a healthcheck pointed at it would mark
      # this container unhealthy — and have it restarted — whenever the engine restarted.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # The public marketing site — http://localhost:${MARKETING_PORT:-3001}
  #
  # It shares this stack's network and nothing else. No database, no session, no engine: the whole
  # point of separating it from `web` was that it holds no data, so it has no `depends_on` and does
  # not wait on a healthy Postgres to serve a static page. Behind a reverse proxy it is the only
  # service that should be reachable from the public internet alongside `web`.
  #
  # 3001 on the host, 3000 in the container, matching docker-compose.dev.yml — `web` already owns
  # 3000 on the host, and inside its own network namespace this container has the port to itself.
  #
  # ── APP_URL is a BUILD argument, not an environment variable ────────────────────────────────
  # Every page of this site is statically prerendered, so the address of `web` is baked into the
  # HTML when the image is built. Setting it under `environment:` would do nothing — the page has
  # already been rendered. Changing where "Anmelden" points means rebuilding:
  #
  #     APP_URL=https://app.azmoth.com docker compose -f infra/docker/docker-compose.yml build marketing
  #
  # And the value is the address a VISITOR'S BROWSER can reach, so it is a public URL — never
  # http://web:3000, which resolves only inside this network. That is the opposite of
  # ENGINE_BASE_URL above, which is fetched by the `web` container itself.
  # ───────────────────────────────────────────────────────────────────────────────────────────
  marketing:
    build:
      context: ../..
      dockerfile: apps/marketing/Dockerfile
      args:
        # NEXT_PUBLIC_APP_URL is honoured as an alias, so either name in .env works.
        APP_URL: "${APP_URL:-${NEXT_PUBLIC_APP_URL:-https://app.azmoth.com}}"
        NEXT_PUBLIC_SITE_URL: "${MARKETING_SITE_URL:-https://www.azmoth.com}"
    image: azmoth-marketing:0.3.0
    # No `container_name`, for the same reason nothing else here has one.
    ports:
      - "${MARKETING_PORT:-3001}:3000"
    environment:
      # The image already sets NODE_ENV=production; stated here too so that reading this file
      # answers "what does this run as" without opening the Dockerfile.
      NODE_ENV: production
    # No `volumes:` — this service runs the standalone bundle apps/marketing/Dockerfile traces at
    # build time, nothing else. The dev file swaps the Dockerfile and adds bind mounts.
    healthcheck:
      # The homepage. This app has no /api/health and needs none: it renders no live data and
      # depends on no other service, so a 200 here genuinely means the site is up.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # A web UI for the database, and **it does not start with the stack**. Bring it up deliberately:
  #
  #     docker compose -f infra/docker/docker-compose.yml --profile debug up adminer
  #
  # Behind a profile because this is the production file and Adminer is an unauthenticated front door
  # to a database holding approvals and an append-only audit log — anything that can reach its port
  # can read and write every table. A service that starts by default is one that gets published by
  # default, and "there is a database admin UI on 8080" is not a thing to discover from the outside.
  #
  # Published on 127.0.0.1 only, so even when it is running it is reachable from the host and not
  # from the network the host is on. Reaching it from elsewhere is what an SSH tunnel is for.
  #
  # For day-to-day work use docker-compose.dev.yml, where it starts with the stack.
  adminer:
    image: adminer:latest
    profiles: ["debug"]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    # Named so it survives `docker compose down` and is removed only by `down -v`. It holds
    # approvals; deleting it is a decision, not a side effect of stopping the stack.
    name: azmoth-postgres-data
  engine-uploads:
    # Same reasoning, one step earlier in the life of a record: this holds bulk uploads that have
    # been accepted with a `202` and may not have been audited yet. Losing it turns a promise the
    # API already made into a job nothing will ever run.
    name: azmoth-engine-uploads
